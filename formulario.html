<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="servicios.html" method="get"></form>
        <fieldset>
            <legend>
                <p> Inscribete para empezar tu experiencia con Rueda Libre</p>
            </legend>
            <p>
                <label for="nombre">Nombre y Apellido:</label>
                <input type="text" id="nombre-y-Apellido" name="" placeholder="Pepito Perez" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@copialoaqui.com" required>
                

            </p>
            <p>
                <Label for="telefono"> telefono:</Label>
                <input type="tel" id="telefono" name="telefono" placeholder="300422329 ejemplo" required>

            </p>
            <p>
                <label for="documento"> C.C.:</label>
                <input type="number" id="documento" name="documento" placeholder="cedula de identidad" required>
            </p>
            <label for="">Seleciona tu bicicleta</label>
            <select name="" id="">
                <option value="">Bicicleta Electrica</option>
                <option value="">Bicicleta de montaña</option>
                <option value="">Triciclo Electrico </option>
            </select>
        </fieldset>
        <div class="boton">
            <button type="submit">Enviar</button>
    </form>
</body>

</html>
